services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: demo-next-ts:local
    container_name: demo-next-ts
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      USERS_API_BASE_URL: ${USERS_API_BASE_URL:-http://host.docker.internal:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped